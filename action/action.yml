name: "noci-cache"
description: "High-performance Nix binary cache over OCI for GitHub Actions"
author: "lonerOrz"
inputs:
  # 基础配置
  registry:
    description: "OCI registry endpoint"
    required: false
    default: "ghcr.io"
  repo:
    description: "OCI repository (e.g. owner/repo). Default: GITHUB_REPOSITORY"
    required: false
    default: ""
  token:
    description: "Registry token. Default: GITHUB_TOKEN"
    required: false
    default: ""
  signing-key:
    description: "Nix private signing key (key_name:base64). If omitted, runs in fetch-only mode."
    required: false
    default: ""

  # 性能与策略
  compression:
    description: "Compression algorithm (zstd or gzip)"
    required: false
    default: "zstd"
  compression-level:
    description: "Compression level (1-19 for zstd)"
    required: false
    default: "3"
  jobs:
    description: "Compression threads (0 = auto)"
    required: false
    default: "0"
  skip-upstream:
    description: "Skip pushing paths carrying upstream cache.nixos.org signatures"
    required: false
    default: "true"

  # 容错与调试
  fail-on-error:
    description: "Fail the job if push/proxy fails (default: false — cache errors are warnings)"
    required: false
    default: "false"
  proxy-port:
    description: "Port for local proxy (0 = dynamic ephemeral port)"
    required: false
    default: "0"

outputs:
  proxy-url:
    description: "HTTP address of the running noci proxy"
  pushed-count:
    description: "Number of store paths pushed to OCI registry"

runs:
  using: "node24"
  main: "src/index.js"
  post: "src/post.js"
