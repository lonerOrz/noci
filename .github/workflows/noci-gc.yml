name: "Storage GC"

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      target-repositories:
        description: 'JSON array, e.g. ["lonerOrz/noci"]'
        required: true
        type: string

jobs:
  gc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target-repository: ${{ fromJSON(github.event.inputs.target-repositories || '["lonerOrz/noci"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Logical GC + Physical Sweep
        run: |
          nix run .#noci -- gc \
            --max-size 15GB \
            --grace-period 360h \
            --physical-sweep \
            --dry-run=false
        env:
          NOCI_REGISTRY: "ghcr.io"
          NOCI_REPO: ${{ matrix.target-repository }}
          NOCI_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Purge untagged packages
        if: success()
        uses: Chizkiyahu/delete-untagged-ghcr-action@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ matrix.target-repository }}
          package_name: "nix-cache"
          owner_type: ${{ github.event.repository.owner.type == 'Organization' && 'org' || 'user' }}
          untagged_only: true
          except_untagged_multiplatform: false
