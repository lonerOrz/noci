name: "Storage GC"

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      repositories:
        description: "Space-separated repos (e.g. lonerOrz/noci lonerOrz/cachyos-loner)"
        required: true
        type: string

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.parse.outputs.repos }}
    steps:
      - id: parse
        run: |
          input="${{ github.event.inputs.repositories }}"
          if [ -z "$input" ]; then
            input="lonerOrz/noci"
          fi
          json=$(echo "$input" | jq -R -s -c 'split(" ") | map(select(length > 0))')
          echo "repos=$json" >> "$GITHUB_OUTPUT"

  gc:
    needs: parse
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target-repository: ${{ fromJSON(needs.parse.outputs.repos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Logical GC + Physical Sweep
        run: |
          nix run .#noci -- gc \
            --max-size 15GB \
            --grace-period 360h \
            --physical-sweep \
            --dry-run=false
        env:
          NOCI_REGISTRY: "ghcr.io"
          NOCI_REPO: ${{ matrix.target-repository }}
          NOCI_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Purge untagged packages
        if: success()
        uses: Chizkiyahu/delete-untagged-ghcr-action@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ matrix.target-repository }}
          package_name: "nix-cache"
          owner_type: ${{ github.event.repository.owner.type == 'Organization' && 'org' || 'user' }}
          untagged_only: true
          except_untagged_multiplatform: false
