name: "Test Action Install from @v1"
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Setup noci binary cache (from @v1 tag)
        uses: lonerOrz/noci/action@v1
        with:
          repo: ${{ secrets.NOCI_REPO || github.repository }}
          signing-key: ${{ secrets.NOCI_SIGNING_KEY }}
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        id: noci

      - name: Verify
        run: |
          echo "Proxy URL: ${{ steps.noci.outputs.proxy-url }}"
          echo "Action install successful!"
